worker_processes auto;
worker_rlimit_nofile 200000;

events {
  worker_connections 100000;
  multi_accept on;
}

http {
  access_log off;
  include /etc/nginx/mime.types;

  # DNS interno de Docker: permite redescubrir réplicas que reinician con otra IP.
  resolver 127.0.0.11 valid=5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # RT-2: round robin puro. Sin ip_hash, sin hash de cookie, sin sticky: una reconexión puede caer
  # en cualquier instancia, y por eso toda continuidad vive en Redis y en el cursor del cliente.
  upstream app_instances {
    zone app_instances 256k;
    server app:3000 resolve;
    keepalive 512;
  }

  server {
    listen 80 reuseport;

    proxy_http_version 1.1;
    # Upgrade va aquí y no en /ws/: un proxy_set_header en una location anula todos los heredados.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Si nginx acumulara la salida, la instancia no vería la contrapresión del cliente lento (RF-9).
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # Un fallo de conexión a una instancia muerta se reintenta en otra, sin afectar al cliente.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 2s;

    location / {
      proxy_pass http://app_instances;
    }
  }
}
