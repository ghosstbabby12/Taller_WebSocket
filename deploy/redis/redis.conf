# Persistencia: el flujo de escritura es pequeño (~90 actas/min, ráfagas de 300), así que podemos
# pagar fsync por escritura. Un acta confirmada al jurado no puede perderse si Redis reinicia.
appendonly yes
appendfsync always

# Nunca expulsar claves por memoria: perder un bloqueo o un acumulado es peor que rechazar una
# escritura. Lo que debe caducar (historial, presencia, idempotencia) tiene su propia política.
maxmemory-policy noeviction

# Un suscriptor lento no puede inflar la memoria de Redis: se le desconecta y hace catch-up desde
# los Streams (ver RedisBackplane).
client-output-buffer-limit pubsub 32mb 8mb 60
